version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: walletiq-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-walletiqdb}
      MYSQL_USER: ${MYSQL_USER:-walletiq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-walletiq_pass}
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walletiq-web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-walletiq}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-walletiq_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-walletiqdb}
      - SECRET_KEY=${SECRET_KEY:-walletiq_production_secret_key_change_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - BEHIND_PROXY=${BEHIND_PROXY:-true}
      - AUTO_MIGRATE=true
      - WAIT_FOR_DB=true
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
      - app-instance:/app/instance

volumes:
  mysql-data:
    driver: local
  app-logs:
    driver: local
  app-uploads:
    driver: local
  app-instance:
    driver: local
